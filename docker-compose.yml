name: bough

services:
  db:
    image: pgvector/pgvector:pg18
    container_name: bough_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bough_user
      # Uses the password from env, falls back to bough_pwd if missing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bough_pwd}
      POSTGRES_DB: bough_db
    volumes:
      - postgres_data:/var/lib/postgresql
      # Mount init.sql to run automatically on fresh volume creation
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bough_user -d bough_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: bough_api
    restart: unless-stopped
    environment:
      # Pass DB credentials so the API can build the connection string
      POSTGRES_USER: bough_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bough_pwd}
      POSTGRES_DB: bough_db
      POSTGRES_HOST: db  # Docker's internal DNS name for the db service
      # Pass LLM configuration
      PROVIDER_API_KEY: ${PROVIDER_API_KEY}
      PROVIDER_BASE_URL: ${PROVIDER_BASE_URL:-https://openrouter.ai/api/v1}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-openai/gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    container_name: bough_web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data: